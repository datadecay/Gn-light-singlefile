name: Build single file

# Rebuilds index.html from GN Light every day (after GN Light updates its game
# list), and whenever build.py changes.
on:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:
  push:
    paths:
      - build.py
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the latest GN Light
        uses: actions/checkout@v4
        with:
          repository: datadecay/gn-light
          path: .source/gn-light

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow

      - name: Build index.html
        run: python3 build.py .source/gn-light index.html

      - name: Commit if it changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          src=$(git -C .source/gn-light rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild from GN Light@$src"
          git push
